name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A real PostgreSQL for the database tests in internal/store.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ctt
          POSTGRES_PASSWORD: ctt
          POSTGRES_DB: ctt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ctt:ctt@localhost:5432/ctt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # Scans dependencies and the standard library for known vulnerabilities
      # in code this project actually calls.
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
